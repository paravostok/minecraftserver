<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bothy</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        position: relative;
    }

    body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('stitchedv2.png') repeat-x;
        animation: scroll 120s linear infinite; 
        filter: blur(5px);
        z-index: -1;
    }

    @keyframes scroll {
        0% { background-position: 0 0; }
        100% { background-position: -3000px 0; } 
    }

    h1 {
        font-size: 4em;
        color: white;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        margin: 0.2em 0;
        font-weight: 700;
        letter-spacing: 2px;
    }

    .ip-container, .server-status-container {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 0.5rem;
        cursor: pointer;
        transition: background-color 0.3s ease;
        user-select: none;
        text-shadow: 1px 1px 2px #000;
        color: #fff;
    }

    .ip-container:hover {
        background-color: rgba(255, 255, 255, 0.2);
    }

    #ip-address, .status-text {
        font-size: 1.5em;
        color: #fff;
    }
</style>
</head>
<body>
    <h1>The Bothy</h1>

    <div class="ip-container" onclick="copyIp()">
        <span id="ip-address">81.16.176.157:7181</span>
    </div>

    <div class="server-status-container">
        <span id="player-status-text" class="status-text">Loading server status...</span>
    </div>

    <script>
        const serverIp = '81.16.176.157:7181';

        function copyIp() {
            const ipAddress = document.getElementById('ip-address').innerText;
            const tempInput = document.createElement('textarea');
            tempInput.value = ipAddress;
            document.body.appendChild(tempInput);

            tempInput.select();
            document.execCommand('copy');

            document.body.removeChild(tempInput);

            const ipContainer = document.querySelector('.ip-container');
            const originalText = ipContainer.innerHTML;
            ipContainer.innerHTML = '<span style="color: #aaffaa;">Copied!</span>';

            setTimeout(() => {
                ipContainer.innerHTML = originalText;
            }, 1500);
        }

        async function fetchServerStatus() {
            const statusText = document.getElementById('player-status-text');
            statusText.innerText = 'Fetching status...';

            try {
                const url = `https://api.mcsrvstat.us/2/${serverIp}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.online) {
                    const onlinePlayers = data.players.online;
                    const maxPlayers = data.players.max;
                    statusText.innerHTML = `${onlinePlayers} / ${maxPlayers} players online`;
                } else {
                    statusText.innerText = 'Server is currently offline.';
                }
            } catch (error) {
                console.error('Failed to fetch server status:', error);
                statusText.innerText = 'Error fetching server status.';
            }
        }

        fetchServerStatus();
        setInterval(fetchServerStatus, 30000);
    </script>
</body>
</html>
