<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The O'Faolain SMP</title>

<style>

    html, body {

        margin: 0;

        padding: 0;

        height: 100%;

        overflow: hidden;

        font-family: Arial, sans-serif;

    }


    body {

        background: url('stitchedv2.png') repeat-x;

        background-size: cover;

        animation: scroll 120s linear infinite;

        display: flex;

        justify-content: center;

        align-items: center;

        flex-direction: column;

    }


    @keyframes scroll {

        0% { background-position: 0 0; }

        100% { background-position: -3000px 0; }

    }


    h1 {

        font-size: 4em;

        color: white;

        text-shadow: 2px 2px 6px black;

        margin: 0.2em 0;

    }


    .green { color: #008000; }

    .white { color: #ffffff; text-shadow: 1px 1px 2px black; }

    .orange { color: #ff9933; }

</style>

</head>

<body>

    <h1><span class="green">The</span> <span class="white">O'Faolain</span> <span class="orange">SMP</span></h1>

</body>

</html>
