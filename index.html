<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bothy</title>

<!-- This links your favicon! Make sure favicon.png is in the same folder as this file -->
<link rel="icon" type="image/png" href="favicon.png">

<!-- Imports a blocky, Minecraft-style font -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: 'Press Start 2P', monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 2.5rem; 
        position: relative;
        background-color: #121212; 
    }

    body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('dirtBG.png');
        background-repeat: repeat-y; 
        background-size: 100vw auto; 
        background-position: 0 0; /* Anchor point fixed */
        animation: scroll-vertical 120s linear infinite; 
        filter: blur(5px);
        z-index: -1;
    }

    /* Scrolls the background on the Y-axis smoothly */
    @keyframes scroll-vertical {
        0% { background-position-y: 0px; }
        100% { background-position-y: 2160px; } 
    }

    h1 {
        font-size: 3.5em;
        color: white;
        text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.8);
        margin: 0; 
        font-weight: 400;
        letter-spacing: 2px;
        text-align: center;
    }

    .ip-container, .server-status-container {
        padding: 1.2rem 2rem; 
        background-color: rgba(0, 0, 0, 0.4); 
        border: 2px solid rgba(255, 255, 255, 0.2); 
        border-radius: 0; 
        cursor: pointer;
        transition: background-color 0.3s ease, border-color 0.3s ease;
        user-select: none;
        text-align: center;
    }

    .ip-container:hover {
        background-color: rgba(0, 0, 0, 0.6);
        border-color: rgba(255, 255, 255, 0.5);
    }

    #ip-address, .status-text {
        font-size: 1.2em;
        color: #fff;
        line-height: 1.5;
        text-shadow: 2px 2px 0px #000;
    }
</style>
</head>
<body>
    <h1>The Bothy</h1>

    <div class="ip-container" onclick="copyIp()">
        <span id="ip-address">81.16.176.157:7181</span>
    </div>

    <div class="server-status-container">
        <span id="player-status-text" class="status-text">Loading server status...</span>
    </div>

    <script>
        const serverIp = '81.16.176.157:7181';

        function copyIp() {
            const ipAddress = document.getElementById('ip-address').innerText;
            const tempInput = document.createElement('textarea');
            tempInput.value = ipAddress;
            document.body.appendChild(tempInput);

            tempInput.select();
            document.execCommand('copy');

            document.body.removeChild(tempInput);

            const ipContainer = document.querySelector('.ip-container');
            const originalText = ipContainer.innerHTML;
            ipContainer.innerHTML = '<span style="color: #55FF55; font-size: 1.2em; text-shadow: 2px 2px 0px #000;">Copied!</span>';

            setTimeout(() => {
                ipContainer.innerHTML = originalText;
            }, 1500);
        }

        async function fetchServerStatus() {
            const statusText = document.getElementById('player-status-text');
            statusText.innerText = 'Fetching status...';

            try {
                const url = `https://api.mcsrvstat.us/2/${serverIp}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.online) {
                    const onlinePlayers = data.players.online;
                    const maxPlayers = data.players.max;
                    statusText.innerHTML = `${onlinePlayers} / ${maxPlayers} players online`;
                } else {
                    statusText.innerText = 'Server is currently offline.';
                }
            } catch (error) {
                console.error('Failed to fetch server status:', error);
                statusText.innerText = 'Unable to reach API.';
            }
        }

        fetchServerStatus();
        setInterval(fetchServerStatus, 30000);
    </script>
</body>
</html>
